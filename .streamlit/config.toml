[theme]
primaryColor="#0891b2"
backgroundColor="#f8f9fa"
secondaryBackgroundColor="#ffffff"
textColor="#333333"
font="sans serif"

[client]
showErrorDetails=false
toolbarMode="minimal"
showSidebarNavigation=true

[logger]
level="warning"

[server]
port = 8501
headless = true
maxUploadSize = 200
enableXsrfProtection = true
enableCORS = false
runOnSave = true

[browser]
gatherUsageStats = false
serverAddress = "localhost"

# Production optimizations
[client]
# Reduce memory usage
maxMessageSize = 200

[logger]
level = "warning"

[ui]
hideTopBar = false
hideSidebarNav = false
